<!doctype html>
<html lang="en">
  <head>
    <script src="./js/site.js?v=20261110.1"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="shortcut icon"
      href="./assets/images/tiktok.webp"
      type="image/webp"
    />
    <title>Aetheris - TikTok</title>

    <link rel="stylesheet" href="./css/main.css?v=20261011.2" />
    <link rel="stylesheet" href="./css/themes.css?v=20261101.1" />
    <link rel="stylesheet" href="./css/nav.css?v=20261102.1" />
    <script defer src="./js/preload.js?v=20261008.1"></script>
    <script src="./js/theme.js?v=20261101.1"></script>
    <script src="register-sw.js?v=20260907.1" defer></script>

    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg-color, #0f0f0f);
        color: var(--text-color, #e5e5e5);
        font-family: var(--font-sans, system-ui, sans-serif);
      }
      .tiktok-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
      }
      .tiktok-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        /* leave room for the shell's floating menu button */
        padding: 8px 12px 8px 68px;
        background: var(--navbar, #0a0a0a);
        border-bottom: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.08));
      }
      .tiktok-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: var(--text-lg, 20px);
        white-space: nowrap;
      }
      .tiktok-brand img {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        object-fit: cover;
      }
      .tiktok-brand small {
        color: var(--text-muted, rgba(229, 231, 235, 0.64));
        font-size: var(--text-xs, 12px);
        font-weight: 500;
      }
      .tiktok-address {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1 1 320px;
        min-width: 180px;
      }
      .tiktok-address input {
        flex: 1;
        min-width: 0;
        padding: 8px 11px;
        border-radius: var(--radius-sm, 6px);
        border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.08));
        background: var(--surface-1, rgba(255, 255, 255, 0.04));
        color: var(--text-color, #e5e5e5);
        font: inherit;
        font-size: var(--text-sm, 14px);
      }
      .tiktok-address input:focus {
        outline: 2px solid color-mix(in srgb, var(--accent, #6b7280) 55%, transparent);
        outline-offset: 1px;
      }
      .tiktok-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tiktok-btn {
        padding: 8px 13px;
        border: 0;
        border-radius: var(--radius-sm, 6px);
        background: var(--surface-2, rgba(255, 255, 255, 0.07));
        color: var(--text-color, #e5e5e5);
        font: inherit;
        font-size: var(--text-sm, 14px);
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .tiktok-btn:hover {
        background: var(--surface-3, rgba(255, 255, 255, 0.11));
      }
      .tiktok-btn.primary {
        background: #fe2c55;
        color: #fff;
      }
      .tiktok-btn.primary:hover {
        background: #e62249;
      }
      .tiktok-frame-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
        background: #000;
      }
      .tiktok-frame-wrap iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
      .tiktok-status {
        padding: 6px 12px;
        background: var(--navbar, #0a0a0a);
        border-top: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.08));
        color: var(--text-muted, rgba(229, 231, 235, 0.64));
        font-size: var(--text-xs, 12px);
        min-height: 18px;
      }
      .tiktok-status[hidden] {
        display: none;
      }
      @media (max-width: 720px) {
        .tiktok-brand small {
          display: none;
        }
        .tiktok-bar {
          padding: 7px 9px 7px 64px;
          gap: 7px;
        }
        .tiktok-btn {
          padding: 7px 10px;
        }
      }
    </style>
  </head>

  <body>
    <div class="tiktok-shell">
      <div class="tiktok-bar">
        <div class="tiktok-brand">
          <img src="./assets/images/tiktok.webp" alt="" draggable="false" />
          <span>TikTok</span>
          <small>same-origin gateway</small>
        </div>
        <form class="tiktok-address" id="tiktok-form">
          <input
            id="tiktok-url"
            type="text"
            inputmode="url"
            spellcheck="false"
            autocomplete="off"
            aria-label="TikTok address"
            placeholder="https://www.tiktok.com/foryou"
          />
          <button class="tiktok-btn primary" type="submit">Go</button>
        </form>
        <div class="tiktok-actions">
          <button class="tiktok-btn" type="button" id="tiktok-reload">
            Reload
          </button>
          <button class="tiktok-btn" type="button" id="tiktok-open">
            New tab ↗
          </button>
        </div>
      </div>

      <div class="tiktok-frame-wrap">
        <iframe
          id="tiktok-frame"
          title="TikTok"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write"
          allowfullscreen
          referrerpolicy="no-referrer"
        ></iframe>
      </div>

      <div class="tiktok-status" id="tiktok-status" role="status" hidden></div>
    </div>

    <script>
      (function () {
        "use strict";

        var START = "https://www.tiktok.com/foryou?lang=en";
        var RETRY_KEY = "tiktok-feed-retries";
        var frame = document.getElementById("tiktok-frame");
        var input = document.getElementById("tiktok-url");
        var form = document.getElementById("tiktok-form");
        var statusEl = document.getElementById("tiktok-status");
        var reloadBtn = document.getElementById("tiktok-reload");
        var openBtn = document.getElementById("tiktok-open");
        var retries = 0;

        try {
          retries = Number(sessionStorage.getItem(RETRY_KEY) || 0) || 0;
        } catch (_) {}

        function setstatus(text) {
          if (!text) {
            statusEl.hidden = true;
            statusEl.textContent = "";
            return;
          }
          statusEl.hidden = false;
          statusEl.textContent = text;
        }

        function resetretries() {
          retries = 0;
          try {
            sessionStorage.removeItem(RETRY_KEY);
          } catch (_) {}
        }

        function gateway(url) {
          return (
            "/tiktok/tt?url=" +
            encodeURIComponent(url) +
            "&referer=" +
            encodeURIComponent(url) +
            "&tt=1"
          );
        }

        function normalise(value) {
          var text = String(value || "").trim();
          if (!text) return START;
          if (text.charAt(0) === "/") text = "https://www.tiktok.com" + text;
          else if (!/^https?:\/\//i.test(text)) text = "https://" + text;
          try {
            var url = new URL(text);
            if (url.protocol !== "http:" && url.protocol !== "https:")
              return START;
            if (!/(^|\.)tiktok\.com$/i.test(url.hostname))
              url = new URL("https://www.tiktok.com/");
            return url.href;
          } catch (_) {
            return START;
          }
        }

        function navigate(value) {
          var url = normalise(value);
          resetretries();
          setstatus("Loading " + url.replace(/^https?:\/\//, "") + "…");
          input.value = url;
          frame.src = gateway(url);
        }

        function currenttarget() {
          try {
            var target = frame.contentWindow.__TT_TARGET__;
            if (typeof target === "string" && target) return target;
          } catch (_) {}
          return null;
        }

        function onfeed(doc) {
          try {
            var win = doc.defaultView || {};
            var target =
              win.__TT_TARGET__ ||
              (win.location && win.location.href) ||
              "";
            var path = new URL(target, "https://www.tiktok.com").pathname;
            return path === "/" || path === "/foryou";
          } catch (_) {
            return false;
          }
        }

        function feedfailed(doc) {
          try {
            if (!doc || !doc.body || doc.readyState !== "complete") return false;
            if (!onfeed(doc)) return false;
            if (doc.querySelector("video")) return false;
            return (doc.body.innerText || "").indexOf("Something went wrong") !== -1;
          } catch (_) {
            return false;
          }
        }

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          navigate(input.value);
        });

        reloadBtn.addEventListener("click", function () {
          setstatus("Reloading…");
          try {
            frame.contentWindow.location.reload();
          } catch (_) {
            var current = currenttarget() || input.value || START;
            frame.src = gateway(normalise(current));
          }
        });

        openBtn.addEventListener("click", function () {
          window.open(
            gateway(normalise(currenttarget() || input.value || START)),
            "_blank",
            "noopener",
          );
        });

        frame.addEventListener("load", function () {
          var target = currenttarget();
          if (target) input.value = target;
          setstatus("");
        });

        // Keep the address bar in step with TikTok's own SPA navigation.
        setInterval(function () {
          if (document.activeElement === input) return;
          var target = currenttarget();
          if (!target || target === input.value) return;
          input.value = target;
        }, 1000);

        // If TikTok assigns location.href to the site root (its router treats
        // "/" as home), pull the frame back instead of showing Aetheris inside
        // the TikTok area. Real TikTok routes are all separate paths.
        var SITEPAGE_RE =
          /^\/(?:index|home|apps|tiktok|cheats|search|chat|ai|movies|settings|about|load|maths|minichat)\.html?$/;
        setInterval(function () {
          try {
            var current = new URL(frame.contentWindow.location.href);
            if (current.origin !== location.origin) return;
            if (current.pathname === "/" || SITEPAGE_RE.test(current.pathname)) {
              frame.src = gateway(currenttarget() || input.value || START);
            }
          } catch (_) {}
        }, 2000);

        // The feed API flakes occasionally at the transport level (TikTok's
        // "Something went wrong" card). Retry only For You, at most twice.
        setInterval(function () {
          var doc;
          try {
            doc = frame.contentDocument;
          } catch (_) {
            return;
          }
          if (!doc || !feedfailed(doc)) {
            if (retries) resetretries();
            return;
          }
          if (retries >= 2) {
            setstatus(
              "TikTok is not loading the feed. Reload or try again later.",
            );
            return;
          }
          retries++;
          try {
            sessionStorage.setItem(RETRY_KEY, String(retries));
          } catch (_) {}
          setstatus("The feed did not load. Retrying…");
          try {
            frame.contentWindow.location.reload();
          } catch (_) {
            frame.src = gateway(currenttarget() || input.value || START);
          }
        }, 3000);

        navigate(START);
      })();
    </script>
  </body>
</html>
